<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta
			data-shell-description
			name="description"
			content="The Book Tracker lets you keep track of your reading and provides helpful estimates of how long a book will take to finish."
		/>
		<meta name="theme-color" content="#35686a" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Book Tracker" />

		<title data-shell-title>Personal Book Tracker</title>
		<meta data-profile-head-slot content="" />

		<link rel="icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.json" />
		<script>document.documentElement.classList.add('js');</script>

		<style>
			:root {
				background-color: #35686a;
				color-scheme: light;
			}

			html,
			body,
			#app-shell {
				min-height: 100%;
			}

			html:not(.js) #profile-snapshot-slot:not(:empty) + #app-shell {
				display: none;
			}

			html.js #profile-snapshot-slot:not(:empty) {
				display: none;
			}

			body {
				margin: 0;
				background-color: #35686a;
			}

			#app-shell {
				box-sizing: border-box;
				min-height: 100vh;
				min-height: 100dvh;
				background:
					radial-gradient(circle at 50% 35%, rgb(255 255 255 / 14%), transparent 18rem),
					linear-gradient(145deg, #35686a, #2f5f61);
				padding:
					env(safe-area-inset-top)
					env(safe-area-inset-right)
					env(safe-area-inset-bottom)
					env(safe-area-inset-left);
			}
		</style>

		%sveltekit.head%
	</head>

	<body>
		<div id="profile-snapshot-slot"></div>
		<div id="app-shell">%sveltekit.body%</div>
	</body>
</html>
